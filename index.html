<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LivePIC Semantic Engine v6</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>LivePIC Semantic Engine v6</h1>
      <p>意味付きメッシュ確認用 / cmo3バイナリからメッシュ候補を抽出</p>
    </div>
    <div class="top-actions">
      <button id="fitBtn">フィット</button>
      <button id="centerBtn">中央</button>
      <button id="resetBtn">リセット</button>
    </div>
  </header>

  <main class="app-grid">
    <section class="stage-card">
      <div class="stage-toolbar">
        <strong id="imageBadge">sample_character.png</strong>
        <span id="cmoBadge">cmo3: 0</span>
        <label><input id="showImage" type="checkbox" checked>画像</label>
        <label><input id="showRegions" type="checkbox" checked>意味領域</label>
        <label><input id="showLabels" type="checkbox" checked>ラベル</label>
        <label><input id="showMesh" type="checkbox" checked>メッシュ</label>
        <label><input id="showLog" type="checkbox" checked>ログ</label>
      </div>
      <canvas id="stage" width="1200" height="900"></canvas>
      <div id="dropHint" class="drop-hint">PNG/JPG/WEBP と .cmo3 をここへドロップしてもOK</div>
    </section>

    <aside class="side-card">
      <section class="box">
        <h2>1. 読み込み</h2>
        <label class="file-row">表示用画像<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <label class="file-row">.cmo3群<input id="cmoInput" type="file" accept=".cmo3" multiple></label>
        <button id="demoBtn" class="wide">サンプル表示</button>
      </section>

      <section class="box">
        <h2>2. テスト</h2>
        <div class="test-buttons">
          <button id="blinkBtn">瞬き</button>
          <button id="mouthBtn">口パク</button>
          <button id="turnBtn">振り向き</button>
          <button id="idleBtn">揺れ</button>
        </div>
      </section>

      <section class="box">
        <h2>3. 変形</h2>
        <label class="select-row">対象<select id="targetSelect"></select></label>
        <div id="controls"></div>
      </section>

      <section class="box grow">
        <h2>4. 読み込み確認</h2>
        <div id="layerList" class="layer-list"></div>
        <pre id="logBox" class="log"></pre>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
