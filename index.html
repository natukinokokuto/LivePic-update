<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>立ち絵モーションLite - Prototype</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>立ち絵モーションLite</h1>
      <p>1枚絵を読み込んで、疑似的に“生きてる感”を出す試作アプリ</p>
    </div>
    <div class="pill">Prototype v0.1</div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>1. 画像読み込み</h2>
      <input id="fileInput" type="file" accept="image/*" />
      <div class="hint">
        PNG推奨。背景透過PNGならOBSでも使いやすいです。
      </div>

      <h2>2. 指定モード</h2>
      <div class="tool-grid">
        <button class="tool active" data-point="face">顔中心</button>
        <button class="tool" data-point="leftEye">左目</button>
        <button class="tool" data-point="rightEye">右目</button>
        <button class="tool" data-point="mouth">口</button>
        <button class="tool" data-point="neck">首</button>
        <button class="tool" data-point="body">体中心</button>
      </div>
      <p class="hint">プレビュー上をクリックすると、選択中のポイントを配置できます。</p>

      <h2>3. 保存/読込</h2>
      <div class="row">
        <button id="saveBtn">設定を書き出し</button>
        <button id="loadBtn">設定を読み込み</button>
      </div>
      <textarea id="settingsBox" placeholder="ここに設定JSONが出ます / 貼り付けて読み込み"></textarea>
    </section>

    <section class="stage-card">
      <div class="stage-toolbar">
        <button id="toggleMotionBtn">モーション ON</button>
        <button id="blinkBtn">まばたき</button>
        <button id="talkBtn">口パク</button>
        <button id="obsBtn">OBS風表示</button>
      </div>
      <div id="stage" class="stage">
        <canvas id="canvas"></canvas>
        <div id="dropMessage">画像を読み込んでください</div>
      </div>
      <div class="readout">
        <span>操作: 画像上クリックでポイント配置</span>
        <span id="currentTool">選択中: 顔中心</span>
      </div>
    </section>

    <section class="panel">
      <h2>動き調整</h2>

      <label>呼吸・上下揺れ <span id="breathVal">16</span></label>
      <input id="breath" type="range" min="0" max="50" value="16" />

      <label>左右ゆらぎ <span id="swayVal">10</span></label>
      <input id="sway" type="range" min="0" max="40" value="10" />

      <label>顔の傾き <span id="tiltVal">5</span></label>
      <input id="tilt" type="range" min="0" max="18" value="5" />

      <label>口パク量 <span id="mouthVal">18</span></label>
      <input id="mouthAmount" type="range" min="0" max="50" value="18" />

      <label>まばたき潰し <span id="blinkVal">12</span></label>
      <input id="blinkAmount" type="range" min="0" max="35" value="12" />

      <h2>トラッキング仮操作</h2>
      <p class="hint">まずはキーボード/ボタンで疑似確認。次段階でWebカメラ連動を追加。</p>
      <div class="key-help">
        <span>A/D: 顔傾き</span>
        <span>W/S: 上下</span>
        <span>Space: 口パク</span>
        <span>B: まばたき</span>
      </div>
    </section>
  </main>

  <div id="obsOverlay" class="obs hidden">
    <canvas id="obsCanvas"></canvas>
    <button id="closeObs">戻る</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
