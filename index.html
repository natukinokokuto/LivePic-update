<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LivePIC Semantic Engine v1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>LivePIC Semantic Engine</h1>
      <p>Cubism = 意味マッピング / LivePIC = 動作制御</p>
    </div>
    <button id="resetBtn" class="ghost">リセット</button>
  </header>

  <main class="layout">
    <section class="panel left">
      <h2>1. 読み込み</h2>
      <label class="filebox">
        <span>表示用 PNG/JPG</span>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
      </label>
      <label class="filebox">
        <span>.cmo3 群</span>
        <input id="cmoInput" type="file" accept=".cmo3" multiple />
      </label>
      <div class="hint">
        ※ このv1では .cmo3 を「意味領域ファイル」として実読み込みして登録します。<br>
        ※ まだCubism内部メッシュ解析はせず、名前・容量・意味スロットを確認します。
      </div>

      <h2>2. 意味レイヤー</h2>
      <div id="layerList" class="layer-list"></div>
    </section>

    <section class="viewer-wrap">
      <div class="viewer-toolbar">
        <button id="fitBtn">フィット</button>
        <button id="blinkBtn">瞬きテスト</button>
        <button id="mouthBtn">口パクテスト</button>
        <button id="turnBtn">振り向きテスト</button>
        <label><input id="showLabels" type="checkbox" checked /> ラベル</label>
        <label><input id="showGuides" type="checkbox" checked /> ガイド</label>
      </div>
      <canvas id="stage" width="1000" height="1000"></canvas>
      <div id="status" class="status">Semantic Engine Ready</div>
    </section>

    <section class="panel right">
      <h2>3. 変形ビューア</h2>
      <label>対象<select id="targetSelect"></select></label>
      <div id="controlBox" class="controls"></div>

      <h2>描画順</h2>
      <ol id="orderList" class="order-list"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
