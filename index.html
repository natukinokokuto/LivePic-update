<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LivePic v1.0</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<header class="app-header">
  <div>
    <h1>LivePic</h1>
    <p>IRIAM寄せ：体固定・頭部疑似レイヤー・顔トラッキング・誇張表情の全部入り実験版</p>
  </div>
  <div class="header-actions">
    <button id="iriamPresetBtn" class="primary">IRIAM寄せプリセット</button>
    <button id="openObsBtn">OBS表示</button>
    <span class="pill">v1.0 Full Experiment</span>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <h2>画像</h2>
    <label class="fileBox">
      <input id="fileInput" type="file" accept="image/*">
      <span>画像を選択</span>
    </label>
    <div class="row">
      <button id="sampleBtn">サンプル</button>
      <button id="detectFaceBtn" class="primary">顔認識ポイント配置</button>
    </div>
    <div id="fileName" class="hint">透過PNG推奨。GitHub Pages上だと顔認識/カメラが安定。</div>
    <div id="detectStatus" class="hint">顔認識待機中</div>

    <h2>ポイント指定</h2>
    <div class="tool-grid">
      <button class="tool active" data-point="face">顔中心</button>
      <button class="tool" data-point="leftEye">左目</button>
      <button class="tool" data-point="rightEye">右目</button>
      <button class="tool" data-point="mouth">口</button>
      <button class="tool" data-point="chin">あご</button>
      <button class="tool" data-point="neck">首</button>
      <button class="tool" data-point="body">体中心</button>
      <button class="tool" data-point="hair">髪中心</button>
    </div>
    <button id="autoPointBtn">固定プリセット配置</button>
    <p class="hint">ホイールでズーム、ドラッグで移動、クリックでポイント配置。</p>

    <h2>保存/復元</h2>
    <div class="row">
      <button id="saveLocalBtn">保存</button>
      <button id="loadLocalBtn">復元</button>
    </div>
    <div class="row">
      <button id="exportBtn">JSON</button>
      <button id="importBtn">読込</button>
    </div>
    <textarea id="settingsBox" placeholder="設定JSON"></textarea>
  </section>

  <section class="stage-card">
    <div class="stage-toolbar">
      <button id="toggleMotionBtn">モーション ON</button>
      <button id="cameraBtn" class="primary">顔トラッキング OFF</button>
      <button id="micBtn">マイク口パク OFF</button>
      <button id="resetPoseBtn">正面へ戻す</button>
    </div>
    <div class="stage-toolbar">
      <button id="blinkBtn">まばたき</button>
      <button id="talkBtn">口パク</button>
      <button id="autoYawBtn">顔向き自動 OFF</button>
      <button id="debugBtn">ガイド ON</button>
    </div>

    <div class="zoom-toolbar">
      <button id="zoomOutBtn">−</button>
      <input id="zoomRange" type="range" min="50" max="450" value="100">
      <button id="zoomInBtn">＋</button>
      <button id="zoomResetBtn">戻す</button>
      <span id="zoomVal">100%</span>
    </div>

    <div id="stage" class="stage">
      <canvas id="canvas"></canvas>
      <div id="dropMessage">読み込み中...</div>
    </div>

    <div class="readout">
      <span id="currentTool">選択中: 顔中心</span>
      <span id="trackingStatus">Tracking: OFF</span>
      <span id="fps">FPS: --</span>
    </div>

    <div class="tracking-meter">
      <div><span>顔向き</span><b id="meterYaw">0%</b><i><em id="barYaw"></em></i></div>
      <div><span>口開き</span><b id="meterMouth">0%</b><i><em id="barMouth"></em></i></div>
      <div><span>瞬き</span><b id="meterBlink">0%</b><i><em id="barBlink"></em></i></div>
    </div>

    <video id="video" playsinline muted></video>
  </section>

  <section class="panel">
    <h2>IRIAM寄せ構造</h2>
    <label>頭部疑似レイヤー <input id="headLayer" type="checkbox" checked></label>
    <label>体固定 <input id="bodyFixed" type="checkbox" checked></label>
    <label>顔マスク表示 <input id="faceMask" type="checkbox" checked></label>
    <label>隙間カバー <input id="edgeCover" type="checkbox" checked></label>

    <h2>頭・首・髪</h2>
    <label>頭の動き <span id="headMoveVal"></span></label>
    <input id="headMove" type="range" min="0" max="90" value="42">
    <label>顔向き増幅 <span id="yawBoostVal"></span></label>
    <input id="yawBoost" type="range" min="0.5" max="4.0" step="0.1" value="2.4">
    <label>頭の慣性 <span id="headLagVal"></span></label>
    <input id="headLag" type="range" min="0.02" max="0.35" step="0.01" value="0.13">
    <label>首の遅れ <span id="neckLagVal"></span></label>
    <input id="neckLag" type="range" min="0" max="1" step="0.05" value="0.55">
    <label>髪の遅れ <span id="hairLagVal"></span></label>
    <input id="hairLag" type="range" min="0" max="1" step="0.05" value="0.75">

    <h2>呼吸/重心</h2>
    <label>胸呼吸 <span id="breathVal"></span></label>
    <input id="breath" type="range" min="0" max="50" value="12">
    <label>体ゆれ <span id="bodySwayVal"></span></label>
    <input id="bodySway" type="range" min="0" max="20" value="3">
    <label>頭ゆれ <span id="headIdleVal"></span></label>
    <input id="headIdle" type="range" min="0" max="30" value="7">

    <h2>口/目</h2>
    <label>口感度 <span id="mouthSensitivityVal"></span></label>
    <input id="mouthSensitivity" type="range" min="1" max="12" step="0.1" value="7.2">
    <label>口の開き <span id="mouthAmountVal"></span></label>
    <input id="mouthAmount" type="range" min="0" max="150" value="88">
    <label>口の横幅 <span id="mouthWideVal"></span></label>
    <input id="mouthWide" type="range" min="10" max="160" value="82">
    <label>瞬き感度 <span id="blinkSensitivityVal"></span></label>
    <input id="blinkSensitivity" type="range" min="1" max="12" step="0.1" value="6.2">
    <label>瞬き強さ <span id="blinkAmountVal"></span></label>
    <input id="blinkAmount" type="range" min="0" max="130" value="88">
    <label>目線ゆらぎ <span id="eyeWanderVal"></span></label>
    <input id="eyeWander" type="range" min="0" max="40" value="12">

    <h2>顔変形</h2>
    <label>顔圧縮 <span id="faceSquashVal"></span></label>
    <input id="faceSquash" type="range" min="0" max="0.35" step="0.01" value="0.16">
    <label>顔範囲 <span id="faceRadiusVal"></span></label>
    <input id="faceRadius" type="range" min="80" max="450" value="245">
    <label>反応速度 <span id="trackingSpeedVal"></span></label>
    <input id="trackingSpeed" type="range" min="0.05" max="0.55" step="0.01" value="0.22">
  </section>
</main>

<div id="obsOverlay" class="obs hidden">
  <canvas id="obsCanvas"></canvas>
  <button id="closeObs">戻る</button>
</div>

<script src="./app.js"></script>
</body>
</html>
